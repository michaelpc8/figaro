<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>My Medication</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app-stage">
    <section class="phone" aria-label="Medication app preview">
      <div class="phone-screen">
        <div id="screenHost" class="screen-host" aria-live="polite"></div>

        <nav class="bottom-nav" aria-label="Primary navigation">
          <button class="nav-item active" data-screen="medications" type="button">
            <i data-lucide="pill"></i>
            <span>My Meds</span>
          </button>
          <button class="nav-item" data-screen="reminders" type="button">
            <i data-lucide="bell-ring"></i>
            <span>Reminders</span>
          </button>
          <button class="nav-item nav-camera" data-screen="camera" type="button">
            <span class="camera-button"><i data-lucide="camera"></i></span>
            <span>Camera</span>
          </button>
          <button class="nav-item" data-screen="financials" type="button">
            <i data-lucide="dollar-sign"></i>
            <span>Financials</span>
          </button>
          <button class="nav-item" data-screen="pharmacy" type="button">
            <i data-lucide="store"></i>
            <span>Pharmacy</span>
          </button>
        </nav>

        <div id="toast" class="toast" role="status"></div>
      </div>
    </section>
  </main>
</body>
</html>
